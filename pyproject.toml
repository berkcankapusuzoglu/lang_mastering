[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lang-mastering"
version = "0.1.0"
description = "Language learning tool with FSRS spaced repetition"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.25.0",
    "fsrs>=4.0.0",
    "edge-tts>=6.1.0",
    "pyttsx3>=2.90",
    "openai-whisper>=20231117",
    "python-Levenshtein>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lang_mastering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
